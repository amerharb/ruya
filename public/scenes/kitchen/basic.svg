	<path d="M530 708C550 708 550 742 530 742" fill="none" stroke="#e26d5a" stroke-width="7" />
	<rect x="482" y="696" width="50" height="56" rx="6" fill="#e26d5a" />

	<!-- glass -->
	<path d="M564 676H612L606 752H570Z" fill="#d7f0fb" stroke="#a9cfe0" stroke-width="3" />
	<path d="M567 706H609L606 750H570Z" fill="#9fd3ee" />

	<!-- bowl -->
	<path d="M628 712H734C734 740 712 752 681 752C650 752 628 740 628 712Z" fill="#6fb07f" />
	<ellipse cx="681" cy="712" rx="53" ry="8" fill="#8cc79a" />
