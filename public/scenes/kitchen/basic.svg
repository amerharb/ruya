	<rect x="114" y="104" width="122" height="182" rx="4" fill="none" stroke="#68908a" stroke-width="4" />
	<rect x="264" y="104" width="122" height="182" rx="4" fill="none" stroke="#68908a" stroke-width="4" />
	<rect x="226" y="230" width="8" height="40" rx="4" fill="#4d6f6a" />
	<rect x="266" y="230" width="8" height="40" rx="4" fill="#4d6f6a" />

