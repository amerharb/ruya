	<path d="M458 790L424 736" stroke="#9aa7b2" stroke-width="8" stroke-linecap="round" />
	<ellipse cx="416" cy="722" rx="11" ry="17" transform="rotate(-32 416 722)" fill="#9aa7b2" />

