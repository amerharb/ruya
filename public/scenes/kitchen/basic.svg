	<ellipse cx="330" cy="752" rx="70" ry="23" fill="#ffffff" stroke="#d9d9d9" stroke-width="3" />
	<ellipse cx="330" cy="752" rx="44" ry="13" fill="none" stroke="#ececec" stroke-width="3" />

