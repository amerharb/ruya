	<rect x="903" y="497" width="14" height="10" rx="4" fill="#9e3b2d" />
	<rect x="993" y="497" width="14" height="10" rx="4" fill="#9e3b2d" />
	<rect x="915" y="488" width="80" height="52" rx="6" fill="#c94f3d" />
	<ellipse cx="955" cy="488" rx="44" ry="8" fill="#b4432f" />
	<circle cx="955" cy="477" r="7" fill="#9e3b2d" />

