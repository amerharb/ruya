	<path d="M300 860V905M820 905V955M1240 860V905M180 955V1000M640 955V1000M1100 1000V1024" stroke="#c9a77a" stroke-width="3" />
	<rect y="850" width="1536" height="12" fill="#e5d5bd" />

	<!-- base cabinets and the countertop, left of the stove -->
	<rect x="0" y="575" width="880" height="285" fill="#7fa7a0" />
	<path d="M220 590V845M440 590V845M600 655V845M710 655V845" stroke="#68908a" stroke-width="5" />
	<g fill="#4d6f6a">
		<circle cx="200" cy="700" r="7" />
		<circle cx="240" cy="700" r="7" />
		<circle cx="420" cy="700" r="7" />
		<circle cx="460" cy="700" r="7" />
		<circle cx="690" cy="740" r="7" />
		<circle cx="730" cy="740" r="7" />
	</g>
	<rect x="0" y="545" width="880" height="30" fill="#ebe5dc" />
	<rect x="0" y="572" width="880" height="5" fill="#d3cbbf" />

